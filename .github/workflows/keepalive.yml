name: Supabase keep-alive
 
on:
  schedule:
    # Every day at 04:23 UTC (an off-peak minute avoids scheduler delays)
    - cron: "23 4 * * *"
  # Lets you run it by hand from the Actions tab to test it
  workflow_dispatch: {}
 
# The job needs no access to the repository itself
permissions: {}
 
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for table in profiles family_members prescriptions; do
            code=$(curl -sS --retry 3 --retry-delay 10 --retry-all-errors \
              -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$table?select=id&limit=1")
            echo "$table -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Keep-alive failed for table: $table" >&2
              exit 1
            fi
          done
          echo "Keep-alive OK"
 
